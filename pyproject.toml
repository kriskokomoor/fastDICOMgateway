[project]
name = "fastdicom-gateway"
version = "0.1.0"
description = "M1: stateless in-memory DICOM pre-persistence policy gateway demo, built on fastDICOMstructure"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kris Kokomoor" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "google-auth>=2.28",
    "requests>=2.31",
    # Interim GitHub-release dependency, not PyPI: fastDICOMstructure is not
    # yet published to PyPI, so this pins the immutable v0.1.0 tag directly.
    # fastdicomattrs is not declared here -- this project never imports it
    # directly (only fastdicomstructure, which declares its own attrs
    # v0.2.0 dependency); it resolves transitively. Once fastdicomstructure
    # is on PyPI this becomes an ordinary "fastdicomstructure>=0.1.0".
    "fastdicomstructure @ git+https://github.com/kriskokomoor/fastDICOMstructure.git@v0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pydicom>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required by hatchling for the fastdicomstructure PEP 508 direct-reference
# (git+https://...) dependency above -- hatchling refuses direct references
# in [project.dependencies] unless explicitly allowed. Same interim
# GitHub-release rationale as that dependency itself.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fastdicom_gateway"]
