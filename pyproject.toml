[project]
name = "fastdicom-gateway"
version = "0.1.0"
description = "M1: stateless in-memory DICOM pre-persistence policy gateway demo, built on fastDICOMstructure"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kris Kokomoor" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "google-auth>=2.28",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pydicom>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastdicom_gateway"]
